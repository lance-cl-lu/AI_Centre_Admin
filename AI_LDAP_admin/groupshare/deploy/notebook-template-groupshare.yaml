apiVersion: kubeflow.org/v1
kind: Notebook
metadata:
  name: default-template-groupshare
  namespace: kubeflow-user-example-com
  labels:
    groupshare: "enabled"
spec:
  template:
    spec:
      containers:
        - name: notebook
          image: kubeflownotebookswg/jupyter-scipy:v1.8.0
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
          volumeMounts: []
      volumes: []
