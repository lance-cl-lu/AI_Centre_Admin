apiVersion: apps/v1
kind: Deployment
metadata:
  name: groupshare-validating-webhook
  namespace: kubeflow
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: groupshare-validating-webhook
  template:
    metadata:
      labels:
        app: groupshare-validating-webhook
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: groupshare-webhook
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: groupshare-validating-webhook
      containers:
        - name: webhook
          image: docker.io/cguaicadmin/groupshare-webhook:v20260617-172109d
          imagePullPolicy: IfNotPresent
          command: ["python", "/opt/groupshare-webhook/app.py"]
          args: []
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          env:
            - name: GROUPSHARE_PODDEFAULT_NAME
              value: groupshare
            - name: PORT
              value: "8443"
            - name: TLS_CERT_FILE
              value: /tls/tls.crt
            - name: TLS_KEY_FILE
              value: /tls/tls.key
          ports:
            - name: https
              containerPort: 8443
          startupProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - |
                  import os
                  from pathlib import Path
                  import socket
                  import ssl
                  import sys

                  # Compare the local server's leaf with the mounted Secret, even if stale.
                  context = ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT)
                  context.check_hostname = False
                  context.verify_mode = ssl.CERT_NONE
                  with socket.create_connection(("127.0.0.1", int(os.environ.get("PORT", "8443"))), timeout=3) as sock:
                      with context.wrap_socket(sock, server_hostname="groupshare-webhook.kubeflow.svc") as tls:
                          current = tls.getpeercert(binary_form=True)
                  try:
                      cert = Path(os.environ.get("TLS_CERT_FILE", "/tls/tls.crt"))
                      key = Path(os.environ.get("TLS_KEY_FILE", "/tls/tls.key"))
                      if cert.parent == key.parent and (cert.parent / "..data").is_symlink():
                          directory = (cert.parent / "..data").resolve(strict=True)
                          cert, key = directory / cert.name, directory / key.name
                      candidate = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
                      candidate.load_cert_chain(cert, key)
                      leaf = cert.read_text().split("-----END CERTIFICATE-----", 1)[0] + "-----END CERTIFICATE-----\n"
                      expected = ssl.PEM_cert_to_DER_cert(leaf)
                  except (OSError, ValueError):
                      # Keep a working server alive when the replacement pair is invalid.
                      # The reload metric and TLS monitoring report this condition.
                      sys.exit(0)
                  if current != expected:
                      sys.exit("TLS certificate changed; restart required to load the mounted Secret")
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 2
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: tls-runtime
              mountPath: /opt/groupshare-webhook
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: groupshare-webhook-serving-tls
        - name: tls-runtime
          configMap:
            name: groupshare-webhook-runtime
