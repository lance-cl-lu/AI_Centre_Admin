apiVersion: apps/v1
kind: Deployment
metadata:
  name: groupshare-validating-webhook
  namespace: kubeflow
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: groupshare-validating-webhook
  template:
    metadata:
      labels:
        app: groupshare-validating-webhook
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: groupshare-webhook
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: groupshare-validating-webhook
      containers:
        - name: webhook
          image: docker.io/cguaicadmin/groupshare-webhook:v20260617-172109d
          imagePullPolicy: IfNotPresent
          command: ["python", "/opt/groupshare-webhook/app.py"]
          args: []
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          env:
            - name: GROUPSHARE_PODDEFAULT_NAME
              value: groupshare
            - name: PORT
              value: "8443"
            - name: TLS_CERT_FILE
              value: /tls/tls.crt
            - name: TLS_KEY_FILE
              value: /tls/tls.key
          ports:
            - name: https
              containerPort: 8443
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: tls-runtime
              mountPath: /opt/groupshare-webhook
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: groupshare-webhook-serving-tls
        - name: tls-runtime
          configMap:
            name: groupshare-webhook-tls-runtime-20260909
