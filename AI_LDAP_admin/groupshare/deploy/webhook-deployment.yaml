apiVersion: apps/v1
kind: Deployment
metadata:
  name: groupshare-validating-webhook
  namespace: kubeflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: groupshare-validating-webhook
  template:
    metadata:
      labels:
        app: groupshare-validating-webhook
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: groupshare-webhook
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
        - name: webhook
          image: docker.io/cguaicadmin/groupshare-webhook:v20260617-172109d
          imagePullPolicy: IfNotPresent
          env:
            - name: GROUPSHARE_PODDEFAULT_NAME
              value: groupshare
            - name: PORT
              value: "8443"
            - name: TLS_CERT_FILE
              value: /tls/tls.crt
            - name: TLS_KEY_FILE
              value: /tls/tls.key
          ports:
            - name: https
              containerPort: 8443
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: groupshare-webhook-tls
