# Apply only after the API server trusts both the old leaf and the new CA.
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: groupshare-validating-webhook
      containers:
        - name: webhook
          image: docker.io/cguaicadmin/groupshare-webhook:v20260617-172109d
          command: ["python", "/opt/groupshare-webhook/app.py"]
          args: []
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: tls-runtime
              mountPath: /opt/groupshare-webhook
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: groupshare-webhook-serving-tls
        - name: tls-runtime
          configMap:
            name: groupshare-webhook-tls-runtime-20260909
