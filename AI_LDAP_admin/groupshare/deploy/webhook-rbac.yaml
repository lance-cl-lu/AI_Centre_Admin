apiVersion: v1
kind: ServiceAccount
metadata:
  name: groupshare-webhook
  namespace: kubeflow
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: groupshare-webhook-clusterrole
rules:
  - apiGroups: ["kubeflow.org"]
    resources: ["poddefaults"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: groupshare-webhook-clusterrolebinding
subjects:
  - kind: ServiceAccount
    name: groupshare-webhook
    namespace: kubeflow
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: groupshare-webhook-clusterrole
