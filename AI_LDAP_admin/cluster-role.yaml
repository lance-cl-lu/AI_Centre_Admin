apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backend-cluster-role
rules:
- apiGroups:
  - authorization.k8s.io
  resources:
  - subjectaccessreviews
  verbs:
  - create
- apiGroups:
  - kubeflow.org
  resources:
  - profiles
  verbs:
  - get
  - list
  - create
  - delete
  - patch
  - update
# Changing a user's email (api/views.py update_profile_owner_email) also moves the
# namespace's `owner` annotation, which the profile controller requires to equal
# spec.owner.name, and its namespaceAdmin RoleBinding to the new address. Updating a
# binding is checked for privilege escalation, so the backend also needs bind on the
# role it references. Namespace names vary per user, so that rule cannot use resourceNames.
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
  - patch
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - rolebindings
  resourceNames:
  - namespaceAdmin
  verbs:
  - get
  - update
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - clusterroles
  resourceNames:
  - kubeflow-admin
  verbs:
  - bind
- apiGroups:
  - kubeflow.org  
  resources:
  - notebooks
  - notebooks/finalizers
  - poddefaults
  verbs:
  - get
  - list
  - create
  - delete
  - patch
  - update
- apiGroups:
  - ""
  resources:
  - persistentvolumeclaims
  - persistentvolumes
  verbs:
  - create
  - delete
  - get
  - list
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
  - patch
  - update
- apiGroups:
  - ""
  resources:
  - events
  - nodes
  verbs:
  - list
- apiGroups:
  - storage.k8s.io
  resources:
  - storageclasses
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - pods
  - pods/log
  verbs:
  - list
  - get
