apiVersion: apps/v1
kind: Deployment
metadata:
  name: namespace-share-controller
  namespace: kubeflow
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: namespace-share-controller
  template:
    metadata:
      labels:
        app: namespace-share-controller
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: namespace-share-controller
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
        - name: controller
          image: docker.io/cguaicadmin/namespace-share-controller:v20260617-172109d
          imagePullPolicy: IfNotPresent
          env:
            - name: NFS_NAMESPACE
              value: kf-storage
            - name: NFS_DEPLOYMENT
              value: nfs-subdir-external-provisioner
            - name: NFS_CONFIGMAP
              value: namespace-share-nfs-defaults
            - name: NAMESPACE_SHARE_PODDEFAULT_NAME
              value: namespace-share
            - name: POLL_SECONDS
              value: "20"
